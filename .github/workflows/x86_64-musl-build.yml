# x86_64 musl build of openai/codex as fully static binaries.
#
# Companion to x86_64-build.yml (glibc). Builds the same `codex` + `bwrap`
# binaries but links them against musl via Zig so the resulting tarball runs
# on any x86_64 Linux (glibc or musl based — glibc-bleeding-edge distros,
# Alpine, TinyCore, ...). Mirrors the approach used by justwasm/peri's
# release-agent workflow: cargo-zigbuild against a pinned Zig dev build
# downloaded from ziglang.org (the GitHub Actions setup-zig actions hang
# on the runner), readelf verification for "no dynamic loader" and "no
# (NEEDED) entries", then exercise the artifact under qemu-user-static +
# Alpine before publishing.
#
# Outputs land on the same rolling tag as the glibc build
# (codex-x86_64-latest), so installers can pick musl or gnu by file name:
#   codex-x86_64-unknown-linux-gnu.tar.gz   <- x86_64-build.yml
#   codex-x86_64-unknown-linux-musl.tar.gz  <- this file

name: x86_64-musl-build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/x86_64-musl-build.yml'

concurrency:
  group: x86_64-musl-build
  cancel-in-progress: true

jobs:
  build:
    name: x86_64 codex musl build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
      CODEX_PIN: ${{ vars.CODEX_PIN || 'c5a3700dd7ee73a07b30ce1516dae51a264bb8cf' }}
      # Disable aws-lc jitter entropy code path on musl builders (mirrors
      # upstream openai/codex rust-release.yml).
      AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
      AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_musl: "1"
    steps:
      - uses: actions/checkout@v4

      # codex's bwrap crate links against libcap (Linux capability),
      # and openssl-sys / zlib-sys need pkg-config headers at build time
      # even with a Zig musl sysroot — host glibc headers must be on
      # PATH for `pkg-config --cflags libcap zlib libssl` to resolve.
      - name: Install host build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev cmake jq libssl-dev zlib1g-dev axel

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          source "$HOME/.cargo/env"
          rustup target add x86_64-unknown-linux-musl
          rustup component add clippy rustfmt
          rustc -vV

      - name: Install Zig
        shell: bash
        run: |
          # Pinned Zig dev build; sha256 verified to avoid surprise
          # upgrades. axel --num-connections=16 keeps the download under
          # the GitHub Actions 60-second step ceiling on this runner.
          ZIG_VERSION=0.17.0-dev.2151+2ec5523d5
          ZIG_ARCHIVE="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          axel --num-connections=16 --output="${ZIG_ARCHIVE}" \
            "https://ziglang.org/builds/${ZIG_ARCHIVE}"
          echo "6393818b7e318bd4ffa345a736a092d780df9ba257b2e7b56cd6366a7a40584b  ${ZIG_ARCHIVE}" | sha256sum --check
          tar --extract --file "${ZIG_ARCHIVE}"
          echo "${PWD}/zig-x86_64-linux-${ZIG_VERSION}" >> "${GITHUB_PATH}"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Checkout codex source (pinned)
        run: |
          git clone --depth 1 https://github.com/openai/codex.git codex
          git -C codex fetch --depth 1 origin "$CODEX_PIN"
          git -C codex checkout -q "$CODEX_PIN"
          echo "codex revision: $(git -C codex rev-parse --short HEAD)"

      - name: Compute cache key
        id: cachekey
        run: |
          source "$HOME/.cargo/env"
          echo "lock_hash=$(sha256sum codex/codex-rs/Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain=$(rustc -vV 2>/dev/null | grep '^release' | cut -d' ' -f2 || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo registry cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: x86_64-musl-registry-${{ steps.cachekey.outputs.lock_hash }}

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: codex/codex-rs/target
          key: x86_64-musl-target-${{ steps.cachekey.outputs.lock_hash }}-${{ steps.cachekey.outputs.toolchain }}

      - name: Fetch dependencies
        run: |
          source "$HOME/.cargo/env"
          cd codex/codex-rs
          cargo fetch --locked

      - name: Build static release binaries
        run: |
          source "$HOME/.cargo/env"
          cd codex/codex-rs
          # -C target-feature=+crt-static forces Rust to emit a static CRT
          # even when the host would default to dynamic. cargo-zigbuild
          # hands the linker off to Zig's bundled musl toolchain, so the
          # output is fully static.
          RUSTFLAGS="-C target-feature=+crt-static" \
            cargo zigbuild --release --locked \
              --target x86_64-unknown-linux-musl \
              --bin codex --bin bwrap
          ls -lh target/x86_64-unknown-linux-musl/release/codex target/x86_64-unknown-linux-musl/release/bwrap
          file target/x86_64-unknown-linux-musl/release/codex

      - name: Verify static Linux binary
        shell: bash
        run: |
          set -euo pipefail
          for bin in codex bwrap; do
            BINARY="codex/codex-rs/target/x86_64-unknown-linux-musl/release/${bin}"
            if readelf -l "${BINARY}" | grep -q 'Requesting program interpreter'; then
              echo "${bin}: has a dynamic loader — not static."
              exit 1
            fi
            if readelf -d "${BINARY}" | grep -q '(NEEDED)'; then
              echo "${bin}: has dynamic library dependencies — not static."
              exit 1
            fi
            echo "${bin}: static (no PT_INTERP, no (NEEDED))."
          done

      - name: Set up QEMU for Alpine verification
        uses: docker/setup-qemu-action@v3

      - name: Run static Linux binary in Alpine
        run: |
          mkdir -p dist
          cp codex/codex-rs/target/x86_64-unknown-linux-musl/release/codex dist/codex-x86_64-unknown-linux-musl
          cp codex/codex-rs/target/x86_64-unknown-linux-musl/release/bwrap dist/bwrap-x86_64
          chmod +x dist/codex-x86_64-unknown-linux-musl dist/bwrap-x86_64
          docker run --rm --platform linux/amd64 \
            --volume "${PWD}/dist:/dist:ro" \
            alpine:3.21 \
            /dist/codex-x86_64-unknown-linux-musl --version
          # bwrap needs CAP_SYS_ADMIN; under qemu-user-static that won't be
          # granted, but the binary itself should still report its version
          # string. If --version is wired, --help is too.
          docker run --rm --platform linux/amd64 \
            --volume "${PWD}/dist:/dist:ro" \
            alpine:3.21 \
            /dist/codex-x86_64-unknown-linux-musl --help >/dev/null

      - name: Package release tarball
        if: success()
        run: |
          cd dist
          tar -czf ../codex-x86_64-unknown-linux-musl.tar.gz \
            codex-x86_64-unknown-linux-musl bwrap-x86_64
          sha256sum ../codex-x86_64-unknown-linux-musl.tar.gz

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: codex-x86_64-unknown-linux-musl
          path: codex-x86_64-unknown-linux-musl.tar.gz
          retention-days: 30

      - name: Publish GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG="codex-x86_64-latest"
          ASSET="codex-x86_64-unknown-linux-musl.tar.gz"
          COMMIT="$(git -C codex rev-parse --short HEAD)"
          CODEX_VER="$(./codex/codex-rs/target/x86_64-unknown-linux-musl/release/codex --version 2>&1 | head -1 || echo unknown)"
          AUTH="Authorization: Bearer $GH_TOKEN"
          API="https://api.github.com/repos/$REPO"

          # Create the (rolling) release if it does not exist yet.
          RELEASE_ID="$(curl -fsSL -H "$AUTH" "$API/releases/tags/$TAG" | jq -r '.id // empty' 2>/dev/null || true)"
          if [ -z "$RELEASE_ID" ]; then
            curl -fsSL -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"codex x86_64 (latest)\",\"body\":\"Codex CLI x86_64 build from openai/codex @ \`$COMMIT\`\\n\\n\`$CODEX_VER\`\"}" \
              "$API/releases" >/dev/null 2>&1 || true
            RELEASE_ID="$(curl -fsSL -H "$AUTH" "$API/releases/tags/$TAG" | jq -r '.id')"
          fi

          # Remove a stale asset with the same name, then upload the new one.
          OLD_ASSET_ID="$(curl -fsSL -H "$AUTH" "$API/releases/$RELEASE_ID/assets" | jq -r --arg name "$ASSET" '.[] | select(.name == $name) | .id' | head -1 || true)"
          if [ -n "$OLD_ASSET_ID" ]; then
            curl -fsSL -X DELETE -H "$AUTH" "$API/releases/assets/$OLD_ASSET_ID" >/dev/null || true
          fi

          curl -fsSL -X POST -H "$AUTH" -H "Content-Type: application/gzip" \
            --data-binary "@$ASSET" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$ASSET" >/dev/null
          echo "Published: https://github.com/$REPO/releases/tag/$TAG"
