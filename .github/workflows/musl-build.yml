# Cross-build openai/codex on ubuntu-latest as fully static musl binaries
# using cargo-zigbuild + Zig. Companion to the glibc workflows
# (x86_64-build.yml, i686-build.yml, riscv64-build.yml) — same source,
# same binaries, different (static) ABI. Asset name carries the suffix
# (-unknown-linux-musl vs -unknown-linux-gnu) so both flavors coexist on
# the per-arch rolling release.
#
# bwrap is currently skipped on this path: its build script vendors
# bubblewrap's C sources and links them against libcap via pkg-config,
# which requires a hand-rolled zigcc shim + a target sysroot (see
# openai/codex .github/scripts/install-musl-build-tools.sh). On a
# future pass we'll wire that up; for now the cross build produces
# codex only and the host workflow remains the source of bwrap.

name: musl-build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/musl-build.yml'

concurrency:
  group: musl-build
  cancel-in-progress: true

jobs:
  build:
    name: musl/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # goarch echoes Rust's --target GOARCH so the Zig target triple
        # $(goarch)-linux-musl lines up with ${{ matrix.target }} below.
        # alpine_platform is the Docker/QEMU platform string — linux/amd64
        # for x86_64, linux/386 for i686, linux/arm64 for aarch64,
        # linux/riscv64 for riscv64.
        include:
          - goarch: x86_64
            target: x86_64-unknown-linux-musl
            alpine_platform: linux/amd64
            asset_suffix: x86_64
          - goarch: i686
            target: i686-unknown-linux-musl
            alpine_platform: linux/386
            asset_suffix: i686
          - goarch: aarch64
            target: aarch64-unknown-linux-musl
            alpine_platform: linux/arm64
            asset_suffix: aarch64
          - goarch: riscv64gc
            target: riscv64gc-unknown-linux-musl
            alpine_platform: linux/riscv64
            asset_suffix: riscv64
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
      CODEX_PIN: ${{ vars.CODEX_PIN || 'c5a3700dd7ee73a07b30ce1516dae51a264bb8cf' }}
      CODEX_SKIP_BWRAP_BUILD: "1"
      # Disable aws-lc jitter entropy code path on musl builders (mirrors
      # upstream openai/codex rust-release.yml; the per-target _x86_64_…
      # form is needed too and is set in a dedicated step below since env
      # keys can't reference matrix values directly).
      AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
      MUSL_TOOLS_DIR: /tmp/codex-musl-tools-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      # i686/aarch64 cross-tools come from g++-multilib / g++-arm-linux-gnu
      # so any pkg-config probe (libcap on host glibc during the host-only
      # build-script compile, e.g.) can resolve. musl linking itself is
      # handed to Zig.
      - name: Install host build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev cmake jq libssl-dev zlib1g-dev axel

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          source "$HOME/.cargo/env"
          rustup target add "${{ matrix.target }}"
          rustup component add clippy rustfmt
          rustc -vV

      - name: Install Zig
        shell: bash
        run: |
          # Pinned Zig dev build; sha256 verified to avoid surprise
          # upgrades. axel --num-connections=16 keeps the download under
          # the GitHub Actions 60-second step ceiling on this runner.
          ZIG_VERSION=0.17.0-dev.2151+2ec5523d5
          ZIG_ARCHIVE="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          axel --num-connections=16 --output="${ZIG_ARCHIVE}" \
            "https://ziglang.org/builds/${ZIG_ARCHIVE}"
          echo "6393818b7e318bd4ffa345a736a092d780df9ba257b2e7b56cd6366a7a40584b  ${ZIG_ARCHIVE}" | sha256sum --check
          tar --extract --file "${ZIG_ARCHIVE}"
          echo "${PWD}/zig-x86_64-linux-${ZIG_VERSION}" >> "${GITHUB_PATH}"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Set per-target aws-lc env (musl)
        shell: bash
        run: |
          target="${{ matrix.target }}"
          # mirror upstream openai/codex rust-release.yml: the per-target
          # form uses dashes → underscores. AWS_LC_SYS_NO_JITTER_ENTROPY is
          # also set globally in env above.
          var="AWS_LC_SYS_NO_JITTER_ENTROPY_${target//-/_}"
          echo "${var}=1" >> "$GITHUB_ENV"

      - name: Checkout codex source (pinned)
        run: |
          git clone --depth 1 https://github.com/openai/codex.git codex
          git -C codex fetch --depth 1 origin "$CODEX_PIN"
          git -C codex checkout -q "$CODEX_PIN"
          echo "codex revision: $(git -C codex rev-parse --short HEAD)"

      # i686 source-level patches: codex's linux-sandbox (libc 0.2.186 +
      # seccompiler 0.5.0) doesn't compile on x86: libc 0.2.186 actually
      # does export SYS_accept4 on i686 so the landlock.rs patch's
      # cfg-gated SYS_accept → SYS_accept4 fallback covers it, but
      # seccompiler 0.5.0 still has no TargetArch::x86 variant. We avoid
      # vendoring seccompiler (5 MB of generated cargo-vendor output) by
      # cloning the upstream repo at runtime and applying a small
      # upstream-compat patch on top.
      - name: Apply i686 source patches
        if: matrix.goarch == 'i686'
        run: |
          set -euo pipefail
          cd codex/codex-rs
          git apply --whitespace=nowarn "${GITHUB_WORKSPACE}/.github/patches/i686/landlock.patch"
          echo "applied landlock.rs patch"

      - name: Materialize seccompiler fork (i686)
        if: matrix.goarch == 'i686'
        run: |
          set -euo pipefail
          # Clone the justwasm/seccompiler fork (rust-vmm/seccompiler @
          # i686-support, which already carries the 10-line TargetArch::x86
          # patch). The patch itself lives at
          # .github/patches/i686/seccompiler-x86.patch in this repo so the
          # change is reviewable here; the fork just hosts the integrated
          # result so the workflow stays one git clone + zero apply.
          SECCOMPILER_DIR="codex/codex-rs/vendor/seccompiler"
          rm -rf "${SECCOMPILER_DIR}"
          git clone --depth 1 --branch i686-support \
            https://github.com/justwasm/seccompiler.git "${SECCOMPILER_DIR}"
          rm -rf "${SECCOMPILER_DIR}/.git"
          mkdir -p codex/codex-rs/.cargo
          cat > codex/codex-rs/.cargo/config.toml <<'EOF'
          [patch.crates-io]
          seccompiler = { path = "vendor/seccompiler" }
          EOF
          cat codex/codex-rs/.cargo/config.toml

      - name: Compute cache key
        id: cachekey
        run: |
          source "$HOME/.cargo/env"
          echo "lock_hash=$(sha256sum codex/codex-rs/Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain=$(rustc -vV 2>/dev/null | grep '^release' | cut -d' ' -f2 || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo registry cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: musl-${{ matrix.goarch }}-registry-${{ steps.cachekey.outputs.lock_hash }}
          # Fallback to the most recent registry snapshot for any prior
          # lock hash on the same arch, so a codex Cargo.lock update only
          # downloads the new crates instead of the world.
          restore-keys: |
            musl-${{ matrix.goarch }}-registry-

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: codex/codex-rs/target
          key: musl-${{ matrix.goarch }}-target-${{ steps.cachekey.outputs.lock_hash }}-${{ steps.cachekey.outputs.toolchain }}
          # Same fallback strategy as registry: a new lock hash inherits
          # the previous target dir, so the first rebuild after a codex
          # Cargo.lock bump compiles only the changed crates.
          restore-keys: |
            musl-${{ matrix.goarch }}-target-

      - name: Restore openssl sysroot cache
        # install-musl-openssl.sh from a clean checkout spends ~3 min
        # compiling OpenSSL 3.6.4 + libatomic.shim from source per arch.
        # Persist the prefix across runs keyed on arch + openssl_version
        # so only the first build pays the cost.
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MUSL_TOOLS_DIR }}
          key: musl-openssl-${{ matrix.goarch }}-3.6.4
          restore-keys: |
            musl-openssl-${{ matrix.goarch }}-


      - name: Fetch dependencies
        if: matrix.goarch != 'i686'
        run: |
          source "$HOME/.cargo/env"
          cd codex/codex-rs
          cargo fetch --locked

      # i686 skips --locked because the vendored seccompiler (path dep
      # registered via [patch.crates-io]) needs a fresh lockfile entry —
      # there's no way to teach cargo about a path replacement without
      # adding the path dep to the lock. The modified lockfile lives
      # inside the openai/codex checkout and never gets committed back.
      - name: Fetch dependencies (i686)
        if: matrix.goarch == 'i686'
        run: |
          source "$HOME/.cargo/env"
          cd codex/codex-rs
          cargo fetch

      # Build a per-target musl libssl.a / libcrypto.a via Zig cc so
      # cargo zigbuild can statically link against openssl-sys. Required
      # for every target except x86_64, where the host's libssl-dev
      # already matches the target arch (cargo happily reuses host's
      # libssl.a on a same-arch cross). For i686 / aarch64 / riscv64gc
      # the host openssl has the wrong arch, so we build a static openssl
      # per-target and emit *_OPENSSL_DIR=… to $GITHUB_ENV.
      - name: Build per-target musl openssl
        if: matrix.goarch != 'x86_64'
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-openssl.sh"

      # On i686-musl openssl's threads_pthread.c references
      # __atomic_is_lock_free as a runtime function; Zig's bundled
      # i686-linux-musl sysroot doesn't ship libatomic.a, so without a
      # shim the link step fails. The script emits -L… -latomic into
      # RUSTFLAGS so the shim's libatomic.a is consulted last, after
      # openssl's .a is scanned for undefined symbols. No-op on other
      # arches (they expand __atomic_is_lock_free at compile time).
      - name: Build libatomic shim (i686)
        if: matrix.goarch == 'i686'
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/build-libatomic.sh"

      - name: Build static release binary
        run: |
          source "$HOME/.cargo/env"
          cd codex/codex-rs
          # -C target-feature=+crt-static forces Rust to emit a static CRT
          # even when the host would default to dynamic. cargo-zigbuild
          # hands the linker off to Zig's bundled musl toolchain, so the
          # output is fully static. CODEX_SKIP_BWRAP_BUILD=1 (env above)
          # tells codex-bwrap's build script to skip compiling bubblewrap
          # against libcap — pkg-config can't resolve libcap without a
          # target sysroot, and bwrap is out of scope for this first
          # cross pass.
          #
          # --config overrides codex-rs/Cargo.toml's release profile: that
          # profile ships `debug = "line-tables-only"`, `strip = false`,
          # `split-debuginfo = "off"` — a deliberate "the packaging tool
          # archives sidecar symbols then strips" handoff that we don't run.
          # Without the overrides every release tarball carries ~50 MB of
          # dwarf per arch. Forcing debug = "none" + strip = "symbols" at
          # build time drops the tarball to ~30 MB and skips the dwarf parse
          # at startup; the trade-off is no stack-trace symbolication on
          # crashes, which release binaries never offered anyway.
          # RUSTFLAGS already carries `-C link-arg=-L<…> -C link-arg=-latomic`
          # for i686 (set by build-libatomic.sh) to wire up __atomic_is_lock_free.
          RUSTFLAGS="-C target-feature=+crt-static ${RUSTFLAGS:-}" \
            cargo zigbuild --release --locked \
              --target "${{ matrix.target }}" \
              --bin codex \
              --config 'profile.release.debug="none"' \
              --config 'profile.release.strip="symbols"'
          ls -lh "target/${{ matrix.target }}/release/codex"
          file "target/${{ matrix.target }}/release/codex"

      - name: Verify static Linux binary
        shell: bash
        run: |
          set -euo pipefail
          BINARY="codex/codex-rs/target/${{ matrix.target }}/release/codex"
          if readelf -l "${BINARY}" | grep -q 'Requesting program interpreter'; then
            echo "codex: has a dynamic loader — not static."
            exit 1
          fi
          if readelf -d "${BINARY}" | grep -q '(NEEDED)'; then
            echo "codex: has dynamic library dependencies — not static."
            exit 1
          fi
          echo "codex: static (no PT_INTERP, no (NEEDED))."

      - name: Set up QEMU for Alpine verification
        uses: docker/setup-qemu-action@v3

      - name: Run static Linux binary in Alpine
        run: |
          mkdir -p dist
          cp "codex/codex-rs/target/${{ matrix.target }}/release/codex" \
             "dist/codex-${{ matrix.asset_suffix }}-unknown-linux-musl"
          chmod +x "dist/codex-${{ matrix.asset_suffix }}-unknown-linux-musl"
          docker run --rm --platform "${{ matrix.alpine_platform }}" \
            --volume "${PWD}/dist:/dist:ro" \
            alpine:3.21 \
            "/dist/codex-${{ matrix.asset_suffix }}-unknown-linux-musl" --version
          docker run --rm --platform "${{ matrix.alpine_platform }}" \
            --volume "${PWD}/dist:/dist:ro" \
            alpine:3.21 \
            "/dist/codex-${{ matrix.asset_suffix }}-unknown-linux-musl" --help >/dev/null

      - name: Save cargo registry cache
        # `cache-hit != 'true'` is load-bearing: actions/cache/save@v4
        # throws when the key already exists. Each arch's lock hash gets
        # one entry, and only the first push with that hash writes.
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: musl-${{ matrix.goarch }}-registry-${{ steps.cachekey.outputs.lock_hash }}

      - name: Save build cache
        # The target dir is per-arch and per-toolchain; this is the one
        # entry that actually shortens the 40-min rebuild on the next run.
        # LTO/ThinLTO output isn't keyed on the profile override flags
        # (codegen-units, debug) — rustc invalidates individual artifacts
        # based on dep hashes, so a profile tweak still gives a high cache
        # hit rate. A wholesale `--config 'profile.release.lto="fat"'`
        # change would thrash the cache; intentional, not worth fighting.
        if: success()
        uses: actions/cache/save@v4
        with:
          path: codex/codex-rs/target
          key: musl-${{ matrix.goarch }}-target-${{ steps.cachekey.outputs.lock_hash }}-${{ steps.cachekey.outputs.toolchain }}

      - name: Save openssl sysroot cache
        # Catches the whole $RUNNER_TEMP/codex-musl-tools-<target>/ tree
        # built by install-musl-openssl.sh + build-libatomic.sh. ~1.5 GB on
        # disk after a clean build; restoring it on the next run skips the
        # ~3-min openssl 3.6.4 source compile + the i686 libatomic shim.
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MUSL_TOOLS_DIR }}
          key: musl-openssl-${{ matrix.goarch }}-3.6.4

      - name: Package release tarball
        if: success()
        run: |
          cd dist
          tar -czf "../codex-${{ matrix.asset_suffix }}-unknown-linux-musl.tar.gz" \
            "codex-${{ matrix.asset_suffix }}-unknown-linux-musl"
          sha256sum "../codex-${{ matrix.asset_suffix }}-unknown-linux-musl.tar.gz"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: codex-${{ matrix.asset_suffix }}-unknown-linux-musl
          path: codex-${{ matrix.asset_suffix }}-unknown-linux-musl.tar.gz
          retention-days: 30

      - name: Publish GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          ASSET="codex-${{ matrix.asset_suffix }}-unknown-linux-musl.tar.gz"

          # Two releases get touched on every successful run:
          #
          # 1. Per-run immutable tag `codex-linux-musl-YYYYMMDD-SHORTSHA`.
          #    Pinned to the exact codex commit and the run's UTC date, so
          #    every successful dispatch leaves a downloadable snapshot.
          #    Use these when you need to bisect, compare two builds, or
          #    ship a specific revision. Tag format chosen so GitHub
          #    sorts them chronologically (YYYYMMDD > SHA).
          #
          # 2. The "always current" rolling tag `codex-linux-musl-latest`
          #    (separate logic block below). One release, four assets,
          #    each arch's asset self-overwrites on the next run. Useful
          #    for `curl .../latest/download/...` scripts.
          COMMIT="$(git -C codex rev-parse HEAD)"
          COMMIT_SHORT="${COMMIT:0:12}"
          # Use UTC so tag dates don't drift with runner tz.
          RUN_DATE="$(date -u +%Y%m%d)"
          RUN_TAG="codex-linux-musl-${RUN_DATE}-${COMMIT_SHORT}"

          CODEX_VER="$(./codex/codex-rs/target/${{ matrix.target }}/release/codex --version 2>&1 | head -1 || echo unknown)"
          SOURCE_REPO="https://github.com/openai/codex"
          SOURCE_COMMIT="${SOURCE_REPO}/commit/${COMMIT}"

          publish_release() {
            local tag="$1" title="$2"
            local auth="Authorization: Bearer $GH_TOKEN"
            local api="https://api.github.com/repos/$REPO"
            local body="Codex CLI static Linux musl binaries for x86_64, i686, aarch64, and riscv64.\n\nSource: ${SOURCE_REPO}\nSource commit: ${SOURCE_COMMIT}\nCommit: ${COMMIT_SHORT}\nBuild date (UTC): ${RUN_DATE}\nVersion: ${CODEX_VER}"

            local release_id
            release_id="$(curl -fsSL -H "$auth" "$api/releases/tags/$tag" | jq -r '.id // empty' 2>/dev/null || true)"

            if [ -z "$release_id" ]; then
              local payload
              payload="$(jq -n --arg tag "$tag" --arg name "$title" --arg body "$body" \
                '{tag_name: $tag, name: $name, body: $body}')"
              curl -fsSL -X POST -H "$auth" -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d "$payload" \
                "$api/releases" >/dev/null 2>&1 || true
              release_id="$(curl -fsSL -H "$auth" "$api/releases/tags/$tag" | jq -r '.id')"
            else
              # Idempotent refresh — keeps title/body in sync with the latest
              # source pointer on every publish, so the immutable per-run
              # release still reflects the current source-of-truth link.
              local payload
              payload="$(jq -n --arg name "$title" --arg body "$body" '{name: $name, body: $body}')"
              curl -fsSL -X PATCH -H "$auth" -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d "$payload" \
                "$api/releases/$release_id" >/dev/null
            fi

            # Replace this arch's stale asset on the release, leave other
            # arches' assets alone. The per-run tag accumulates one asset
            # per arch that ran in this dispatch; cross-arch artifacts from
            # *previous* runs stay put, which is the right semantics for an
            # immutable snapshot of "codex @ <commit> built by run <date>".
            local old_id
            old_id="$(curl -fsSL -H "$auth" "$api/releases/$release_id/assets" | jq -r --arg name "$ASSET" '.[] | select(.name == $name) | .id' | head -1 || true)"
            if [ -n "$old_id" ]; then
              curl -fsSL -X DELETE -H "$auth" "$api/releases/assets/$old_id" >/dev/null || true
            fi

            curl -fsSL -X POST -H "$auth" -H "Content-Type: application/gzip" \
              --data-binary "@$ASSET" \
              "https://uploads.github.com/repos/$REPO/releases/$release_id/assets?name=$ASSET" >/dev/null

            echo "Published: https://github.com/$REPO/releases/tag/$tag"
          }

          # Immutable per-run snapshot. Created on the first dispatch that
          # publishes this (date, commit) pair, then refreshed on every
          # subsequent run that lands on the same pair (e.g. re-runs of a
          # flaky job) so title/body stay current.
          publish_release "$RUN_TAG" "Codex CLI Linux musl (${RUN_DATE} @ ${COMMIT_SHORT})"

          # Rolling "latest" entry: one release with four self-overwriting
          # assets, refreshed on every run so /releases/latest/download/...
          # always serves the freshest binary.
          publish_release "codex-linux-musl-latest" "Codex CLI Linux musl (latest)"
