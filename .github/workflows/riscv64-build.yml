name: riscv64-build

on:
  push:
  workflow_dispatch:

jobs:
  env-check:
    name: RISC-V runner environment check
    runs-on: [self-hosted, banana-pi-f3]
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          uname -a
          cat /etc/os-release | head -3
          echo "CPUs: $(nproc)"
          free -h | head -2
          df -h "$GITHUB_WORKSPACE" | tail -1
          gcc --version | head -1
          git --version
          docker --version || true
