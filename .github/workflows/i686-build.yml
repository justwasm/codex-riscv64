name: i686-build

on:
  push:
    paths:
      - '.github/workflows/i686-build.yml'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: i686-build
  cancel-in-progress: true

jobs:
  build:
    name: i686 (x86 32-bit) codex build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_INCREMENTAL: "0"
      CODEX_PIN: ${{ vars.CODEX_PIN || 'c5a3700dd7ee73a07b30ce1516dae51a264bb8cf' }}
      CARGO_TARGET: i686-unknown-linux-gnu
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_PATH: /usr/lib/i386-linux-gnu/pkgconfig
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies (with 32-bit arch)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev bubblewrap cmake jq libssl-dev \
            gcc-multilib g++-multilib libssl-dev:i386 libcap-dev:i386

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          source "$HOME/.cargo/env"
          rustup target add i686-unknown-linux-gnu
          rustc -vV

      - name: Checkout codex source (pinned)
        run: |
          git clone --depth 1 https://github.com/openai/codex.git codex
          git -C codex fetch --depth 1 origin "$CODEX_PIN"
          git -C codex checkout -q "$CODEX_PIN"
          echo "codex revision: $(git -C codex rev-parse --short HEAD)"

      - name: Compute cache key
        id: cachekey
        run: |
          source "$HOME/.cargo/env"
          echo "lock_hash=$(sha256sum codex/codex-rs/Cargo.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "toolchain=$(rustc -vV 2>/dev/null | grep '^release' | cut -d' ' -f2 || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo registry cache
        id: registrycache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: i686-registry-${{ steps.cachekey.outputs.lock_hash }}

      - name: Restore build cache
        id: buildcache
        uses: actions/cache/restore@v4
        with:
          path: codex/codex-rs/target
          key: i686-target-${{ env.CARGO_TARGET }}-${{ steps.cachekey.outputs.lock_hash }}-${{ steps.cachekey.outputs.toolchain }}

      - name: Fetch dependencies
        run: |
          source "$HOME/.cargo/env"
          cd codex/codex-rs
          cargo fetch --locked

      - name: Build release binaries
        run: |
          source "$HOME/.cargo/env"
          rustup component add clippy rustfmt rust-src
          cd codex/codex-rs
          cargo build --release --locked --target "$CARGO_TARGET" --bin codex --bin bwrap
          ls -lh "target/$CARGO_TARGET/release/codex" "target/$CARGO_TARGET/release/bwrap"
          file "target/$CARGO_TARGET/release/codex"

      - name: Smoke test
        run: |
          ./codex/codex-rs/target/i686-unknown-linux-gnu/release/codex --version

      - name: Save cargo registry cache
        if: always() && steps.registrycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: i686-registry-${{ steps.cachekey.outputs.lock_hash }}

      - name: Save build cache
        if: always() && steps.buildcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: codex/codex-rs/target
          key: i686-target-${{ env.CARGO_TARGET }}-${{ steps.cachekey.outputs.lock_hash }}-${{ steps.cachekey.outputs.toolchain }}

      - name: Package release tarball
        if: success()
        run: |
          mkdir -p dist
          cp codex/codex-rs/target/i686-unknown-linux-gnu/release/codex dist/codex-i686-unknown-linux-gnu
          cp codex/codex-rs/target/i686-unknown-linux-gnu/release/bwrap dist/bwrap-i686
          cd dist
          tar -czf ../codex-i686-unknown-linux-gnu.tar.gz codex-i686-unknown-linux-gnu bwrap-i686
          sha256sum ../codex-i686-unknown-linux-gnu.tar.gz

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: codex-i686-unknown-linux-gnu
          path: codex-i686-unknown-linux-gnu.tar.gz
          retention-days: 30

      - name: Publish GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG="codex-i686-latest"
          ASSET="codex-i686-unknown-linux-gnu.tar.gz"
          COMMIT="$(git -C codex rev-parse --short HEAD)"
          CODEX_VER="$(./codex/codex-rs/target/i686-unknown-linux-gnu/release/codex --version 2>&1 | head -1 || echo unknown)"
          AUTH="Authorization: Bearer $GH_TOKEN"
          API="https://api.github.com/repos/$REPO"

          # Create the (rolling) release if it does not exist yet.
          RELEASE_ID="$(curl -fsSL -H "$AUTH" "$API/releases/tags/$TAG" | jq -r '.id // empty' 2>/dev/null || true)"
          if [ -z "$RELEASE_ID" ]; then
            curl -fsSL -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"codex i686 (latest)\",\"body\":\"Codex CLI i686 (x86 32-bit) build from openai/codex @ \`$COMMIT\`\\n\\n\`$CODEX_VER\`\"}" \
              "$API/releases" >/dev/null 2>&1 || true
            RELEASE_ID="$(curl -fsSL -H "$AUTH" "$API/releases/tags/$TAG" | jq -r '.id')"
          fi

          # Remove a stale asset with the same name, then upload the new one.
          OLD_ASSET_ID="$(curl -fsSL -H "$AUTH" "$API/releases/$RELEASE_ID/assets" | jq -r --arg name "$ASSET" '.[] | select(.name == $name) | .id' | head -1 || true)"
          if [ -n "$OLD_ASSET_ID" ]; then
            curl -fsSL -X DELETE -H "$AUTH" "$API/releases/assets/$OLD_ASSET_ID" >/dev/null || true
          fi

          curl -fsSL -X POST -H "$AUTH" -H "Content-Type: application/gzip" \
            --data-binary "@$ASSET" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$ASSET" >/dev/null
          echo "Published: https://github.com/$REPO/releases/tag/$TAG"
